name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4]
        laravel: [12.*, 13.*]
        stability: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo, openssl
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Audit dependencies
        run: composer audit

      - name: Execute tests
        run: vendor/bin/pest --ci --coverage --min=95

  test-pgsql:
    runs-on: ubuntu-latest
    name: P8.4 - pgsql real-engine

    steps:
      # Started first so the engine boots while PHP and the dependencies install. The data
      # directory is tmpfs and durability is off: the same planner, isolation levels, locks and
      # limits — nothing this leg proves depends on surviving a power cut.
      - name: Start postgres
        run: >-
          docker run -d --name postgres --tmpfs /var/lib/postgresql/data
          -e POSTGRES_DB=testing -e POSTGRES_USER=testing -e POSTGRES_PASSWORD=secret
          -p 5432:5432 postgres:16
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, intl, fileinfo, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The image's init server listens on the socket only, so a TCP answer means the real one is up.
      - name: Wait for postgres
        run: |
          for _ in $(seq 1 90); do
            docker exec postgres psql -h 127.0.0.1 -U testing -d testing -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Execute tests against postgres
        env:
          # TESTING_DB_DRIVER is what moves the suite off sqlite. The location vars alone
          # only say where the engine is: without the driver this job would run every test
          # on sqlite and call itself a postgres leg.
          #
          # This package's DDL had never met a real engine — the suite ran on sqlite for
          # its whole life, with foreign keys OFF (Laravel's sqlite connector leaves
          # PRAGMA foreign_keys off unless the connection sets foreign_key_constraints,
          # which the old hand-rolled TestCase did not). Its 2 FK edges were unenforced
          # here for the first time until now.
          TESTING_DB_DRIVER: pgsql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 5432
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: testing
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg, and
        # re-measuring it doubles the slowest job for no signal.
        run: vendor/bin/pest --ci

  test-mysql:
    runs-on: ubuntu-latest
    name: P8.4 - mysql real-engine

    steps:
      # Started first, tmpfs datadir, binlog off and no flush per commit — the same InnoDB,
      # isolation levels, locking and limits. performance_schema stays at its default.
      - name: Start mysql
        run: >-
          docker run -d --name mysql --tmpfs /var/lib/mysql
          -e MYSQL_DATABASE=testing -e MYSQL_USER=testing -e MYSQL_PASSWORD=secret -e MYSQL_ROOT_PASSWORD=secret
          -p 3306:3306 mysql:8
          --skip-log-bin --sync-binlog=0 --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=OFF

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, pdo_mysql, bcmath, intl, fileinfo, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The image's init server runs with networking off, so a TCP answer means the real one is up.
      - name: Wait for mysql
        run: |
          for _ in $(seq 1 90); do
            docker exec mysql mysql -h 127.0.0.1 -uroot -psecret -e 'select 1' testing >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs mysql
          exit 1

      - name: Execute tests against mysql
        env:
          # The recorders retry a deadlocked first delivery and apply a lost creation race as
          # an update; both are InnoDB behaviours (gap locks under REPEATABLE READ, error
          # 1213) that sqlite and postgres never produce. MySQL also refuses to drop a table a
          # foreign key still references (3730). This leg runs the whole suite on the engine.
          TESTING_DB_DRIVER: mysql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 3306
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: root
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg.
        run: vendor/bin/pest --ci
